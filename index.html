<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Alguém Especial</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fceade 0%, #f7d6cd 50%, #eec0b3 100%);
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.8);
      --text-main: #2c2523;
      --text-muted: #6e6562;
      --blue-accent: #2563eb;
      --blue-heart: #3b82f6;
      --shadow-soft: 0 30px 60px rgba(0, 0, 0, 0.08), 0 10px 20px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      overflow: hidden;
      padding: 24px;
      position: relative;
    }

    /* Elementos decorativos de rosas ao fundo */
    .background-rose {
      position: absolute;
      opacity: 0.12;
      pointer-events: none;
      z-index: 1;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.05));
    }

    .rose-top-left {
      top: -40px;
      left: -40px;
      width: 260px;
      transform: rotate(-15deg);
    }

    .rose-bottom-right {
      bottom: -40px;
      right: -40px;
      width: 280px;
      transform: rotate(165deg);
    }

    /* Cartão Estilo Apple Glassmorphism */
    .card-container {
      position: relative;
      z-index: 10;
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 48px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-soft);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Ícone topo do cartão */
    .badge-icon {
      width: 64px;
      height: 64px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.04);
    }

    .badge-icon svg {
      width: 32px;
      height: 32px;
      fill: var(--blue-accent);
    }

    .title {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
      font-weight: 400;
      margin-bottom: 32px;
    }

    /* Botão estilo iOS / macOS */
    .btn-apple {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 16px 36px;
      font-size: 1.05rem;
      font-weight: 500;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-apple:hover {
      transform: scale(1.03);
      background: #1d4ed8;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.45);
    }

    .btn-apple:active {
      transform: scale(0.97);
    }

    /* Conteúdo revelado */
    .message-content {
      display: none;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .message-content.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .message-text {
      font-size: 1.2rem;
      line-height: 1.65;
      color: var(--text-main);
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .message-text strong {
      font-weight: 600;
      color: #1e293b;
    }

    .blue-heart-inline {
      display: inline-block;
      vertical-align: middle;
      width: 22px;
      height: 22px;
      fill: var(--blue-accent);
      margin: 0 2px;
    }

    .rose-divider {
      margin: 24px auto;
      width: 60px;
      height: 2px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 2px;
    }

    /* Animação de corações subindo (Azuis) */
    .floating-heart {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      animation: floatUp 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.5) rotate(0deg);
      }
      15% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translateY(-100vh) scale(1.2) rotate(25deg);
      }
    }
  </style>
</head>
<body>

  <!-- Rosas decorativas em SVG de fundo -->
  <svg class="background-rose rose-top-left" viewBox="0 0 100 100" fill="#a855f7">
    <path d="M50 10C35 10 25 25 25 40C25 60 50 85 50 85C50 85 75 60 75 40C75 25 65 10 50 10Z" fill="currentColor"/>
    <circle cx="50" cy="35" r="15" fill="#fecdd3"/>
  </svg>
  
  <svg class="background-rose rose-bottom-right" viewBox="0 0 100 100" fill="#a855f7">
    <path d="M50 10C35 10 25 25 25 40C25 60 50 85 50 85C50 85 75 60 75 40C75 25 65 10 50 10Z" fill="currentColor"/>
    <circle cx="50" cy="35" r="15" fill="#fecdd3"/>
  </svg>

  <div class="card-container">
    <div class="badge-icon">
      <!-- Ícone de Envelope/Coração -->
      <svg viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>

    <!-- Título inicial -->
    <div id="initialState">
      <h1 class="title">Uma mensagem para você</h1>
      <p class="subtitle">Preparei algo especial. Clique abaixo para abrir.</p>
      <button class="btn-apple" onclick="revelarMensagem()">
        Abrir mensagem
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
        </svg>
      </button>
    </div>

    <!-- Conteúdo que aparece após clicar -->
    <div id="messageState" class="message-content">
      <p class="message-text">
        <strong>Você é muito especial pra mim.</strong>
      </p>
      
      <div class="rose-divider"></div>
      
      <p class="message-text">
        Estou morrendo de saudades e quero muito te ver...
        <svg class="blue-heart-inline" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </p>
      
      <p class="message-text" style="margin-top: 14px; color: var(--text-muted); font-size: 1.05rem;">
        Não vejo a hora do tempo poder passar mais rápido para a gente estar junto de novo!
      </p>
    </div>
  </div>

  <script>
    function revelarMensagem() {
      const initialState = document.getElementById('initialState');
      const messageState = document.getElementById('messageState');

      initialState.style.opacity = '0';
      initialState.style.transform = 'scale(0.95)';
      initialState.style.transition = 'all 0.4s ease';

      setTimeout(() => {
        initialState.style.display = 'none';
        messageState.classList.add('active');
        soltarCoracoesAzuis();
      }, 400);
    }

    function soltarCoracoesAzuis() {
      const quantidade = 22;
      for (let i = 0; i < quantidade; i++) {
        setTimeout(() => {
          criarCoracao();
        }, i * 120);
      }
    }

    function criarCoracao() {
      const heart = document.createElement('div');
      heart.classList.add('floating-heart');
      
      // Posição horizontal aleatória
      const posX = Math.random() * window.innerWidth;
      const tamanho = Math.random() * 20 + 16;
      
      heart.style.left = posX + 'px';
      heart.style.bottom = '-20px';
      
      heart.innerHTML = `
        <svg width="${tamanho}" height="${tamanho}" viewBox="0 0 24 24" fill="#3b82f6" style="filter: drop-shadow(0 2px 6px rgba(59,130,246,0.4));">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      `;

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 3600);
    }
  </script>
</body>
</html>
